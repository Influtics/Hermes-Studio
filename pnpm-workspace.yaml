# Build-script allowlist for pnpm 12+.
#
# pnpm 11 removed the `onlyBuiltDependencies` package.json field. In pnpm 12
# the canonical home is this file (map shape, `pkg: true` per entry). Packages
# not listed here are treated as unreviewed and trigger ERR_PNPM_IGNORED_BUILDS
# by default (`strictDepBuilds` defaults to true).
#
# This file is present on a single-package repo purely to hold settings — the
# `packages` field is intentionally omitted, so pnpm treats the root as the
# only workspace member.
#
# Allowlist mirrors what was previously in package.json's
# `pnpm.onlyBuiltDependencies`:
#   - better-sqlite3 — native sqlite binding, must compile
#   - esbuild        — native binary download
#   - unrs-resolver  — native resolver binding
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
