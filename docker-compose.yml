# Hermes Studio + Agent — Docker Compose Setup
#
# Requirements:
#   - Docker & Docker Compose
#   - ANTHROPIC_API_KEY in .env file (required for the agent gateway)
#
# Quick Start (no Redis — sessions stored in container file system):
#   1. cp .env.example .env
#   2. Add your ANTHROPIC_API_KEY to .env
#   3. docker compose up
#   4. Open http://localhost:3000   (only if you add a `ports: ['3000:3000']`
#      block to the hermes-studio service; the default Coolify deploy
#      exposes nothing on the host and is reached via the FQDN only)
#
# With Redis session persistence (sessions survive container restarts):
#   1. Add REDIS_URL=redis://redis:6379 to your .env
#   2. docker compose --profile redis up
#
# Troubleshooting:
#   - Check logs: docker compose logs hermes-studio
#   - Check logs: docker compose logs hermes-agent
#
# Version Pinning:
#   By default, builds the latest Hermes Agent from the main branch.
#   To pin to a specific version (e.g., v0.18.0):
#     HERMES_AGENT_VERSION=0.18.0 docker compose up
#   Or set HERMES_AGENT_VERSION in .env:
#     HERMES_AGENT_VERSION=0.18.0

services:
  # The Hermes AI Agent Gateway
  # Provides the backend API that the workspace connects to
  hermes-agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
      args:
        HERMES_AGENT_VERSION: ${HERMES_AGENT_VERSION:-main}
    env_file:
      - .env
    environment:
      # MiniMax — Anthropic-compatible endpoint. hermes-agent's MiniMax provider
      # is pre-wired for api_mode=anthropic_messages + base_url=https://api.minimax.io/anthropic,
      # so setting MINIMAX_API_KEY is the entire env delta (no ANTHROPIC_BASE_URL hack).
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # Default model the gateway uses when none is selected in the UI.
      # hermes-agent's MiniMax profile default_aux_model is MiniMax-M2.7 (fork variant);
      # this env var overrides it for the user-selected model.
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M3}
      # Opt-in HTTP API server (port 8642). Without this, the gateway serves
      # messaging platforms only and never binds 8642 — the healthcheck
      # curl fails, depends_on service_healthy cascades, hermes-studio never
      # starts. Override to 'false' only if you intentionally want a
      # messaging-only gateway.
      API_SERVER_ENABLED: 'true'
      # Anthropic not used — kept as empty string so existing docs/scripts that
      # probe for this var (e.g. onboarding wizard) don't error.
      ANTHROPIC_API_KEY: ''
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8642/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No host port mapping — Coolify routes hermes-agent internally via
    # the shared Docker network (hermes-studio talks to hermes-agent:8642).
    # Binding 8642 on the host conflicts with anything else using it.

  # The Hermes Studio Web UI
  # Connects to hermes-agent at http://hermes-agent:8642
  #
  # Redis: if REDIS_URL=redis://redis:6379 is set in .env and the redis
  # profile is active, the studio will automatically use Redis for session
  # persistence. If Redis is unavailable on startup, it retries for ~30s
  # then falls back to the file-based store gracefully.
  hermes-studio:
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile
    depends_on:
      hermes-agent:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Internal Docker network URL (not localhost!)
      HERMES_API_URL: http://hermes-agent:8642
      # Inherited from .env — empty string means "no Redis, use file store".
      # Set REDIS_URL=redis://redis:6379 in .env when running --profile redis.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Persist file-based sessions across container restarts (fallback store)
      - studio-sessions:/app/.runtime
    # No host port mapping — Coolify/Traefik routes hermes.influtics.com
    # to this container via FQDN labels. Binding 3000 on the host
    # conflicts with anything else on the host (e.g. Grafana).

  # ─── Optional: Redis session persistence ──────────────────────────────────
  # Activate with: docker compose --profile redis up
  #
  # Enables durable, multi-device session storage backed by Redis AOF.
  # Sessions survive both studio and agent container restarts.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  studio-sessions:
  redis-data:
