# Phase 2.5-001: Secrets scanning CI
# Scans for leaked secrets on PR and push to main

name: Security Scan

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No additional secrets required - uses built-in GITHUB_TOKEN

      - name: Grep for common patterns (fallback)
        if: always()
        run: |
          echo "🔍 Scanning for common secret patterns..."

          # Patterns that indicate secrets.
          #
          # Each pattern requires a realistic key body, not just the
          # vendor prefix. A bare prefix like "sk-ant-" matches any
          # documentation placeholder of the form api_key: "sk-ant-...",
          # which is how this job used to fail on
          # src/screens/docs/docs-screen.tsx — a false positive, not a
          # leaked key. A real Anthropic key is "sk-ant-" plus ~95
          # characters of [A-Za-z0-9_-]; a GitHub fine-grained PAT is
          # "github_pat_" plus ~82 characters.
          PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"
            "sk-ant-[a-zA-Z0-9_-]{20,}"
            "ghp_[a-zA-Z0-9]{36}"
            "github_pat_[a-zA-Z0-9_]{20,}"
            "gho_[a-zA-Z0-9]{36}"
            "PRIVATE KEY"
            "-----BEGIN RSA"
            "-----BEGIN OPENSSH"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null \
              | grep -v node_modules \
              | grep -v ".lock" \
              | grep -v dist \
              | grep -v "test-redaction" \
              | grep -v "diagnostics.ts" \
              | grep -v "placeholder" \
              | grep -v "# pragma: allowlist secret" \
              | grep -v "example\|sample\|fake\|dummy\|test\|mock" ; then
              echo "⚠️ Potential secret found matching: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected! Please review and remove."
            exit 1
          fi

          echo "✅ No obvious secret patterns found"
